<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Connecting to Free Wi-Fi...</title>
    <style>
        body, html { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background-color: black; }
        video { width: 100%; height: 100%; object-fit: cover; }
    </style>
</head>
<body>

<video id="rickroll" width="100%" height="100%" autoplay loop muted playsinline>
    <source src="https://dropbox.com" type="video/mp4">
</video>

<script>
  // Unmutes and ensures smooth video playback the millisecond they tap anywhere on the screen
  document.addEventListener('click', function() {
      const video = document.getElementById('rickroll');
      video.muted = false;
      video.play();
  });
</script>

</body>
</html>
